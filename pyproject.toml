[project]
name = "audioautofill"
version = "0.1.0"
description = "Fill beat-jumped gaps in DJ set recordings with the original track audio."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12",
    "soxr>=0.3",
    "pedalboard>=0.9",
]

[project.optional-dependencies]
# Fallback decoder for formats libsndfile can't read (m4a/aac/alac).
ffmpeg = ["imageio-ffmpeg>=0.5"]

[project.scripts]
audioautofill = "audioautofill.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["audioautofill"]
